---
- name: Configure Windows identity and domain membership
  hosts: all
  gather_facts: false

  vars_files:
    - vars/credentials.yaml

  tasks:
    - name: Wait for WinRM transport to become available
      ansible.builtin.wait_for_connection:
        delay: "{{ 30 if cloud_provider | default('') == 'aws' else 5 }}"
        timeout: "{{ 600 if cloud_provider | default('') == 'aws' else 300 }}"

    - name: Validate WinRM command execution
      ansible.windows.win_shell: hostname
      register: winrm_test
      retries: 12
      delay: 10
      until: winrm_test is succeeded
      changed_when: false

    - name: Join server to domain and set hostname
      microsoft.ad.membership:
        dns_domain_name: "{{ domain_name }}"
        hostname: "{{ inventory_hostname }}"
        domain_admin_user: "{{ domain_join_user }}"
        domain_admin_password: "{{ domain_join_password }}"
        domain_ou_path: "{{ domain_ou_path }}"
        state: domain
        reboot: true
      register: domain_join
      no_log: false

    - name: Reset connection after domain join
      ansible.builtin.meta: reset_connection

    - name: Wait for WinRM to come back
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 600
      when: domain_join.changed

    - name: Validate WinRM after reboot
      ansible.windows.win_shell: hostname
      register: winrm_after_reboot
      retries: 12
      delay: 10
      until: winrm_after_reboot is succeeded
      changed_when: false
      when: domain_join.changed

    - name: Wait for domain secure channel
      ansible.windows.win_shell: |
        if (Test-ComputerSecureChannel) {
          Write-Output "ready"
        } else {
          Write-Output "not_ready"
        }
      register: secure_channel_check
      changed_when: false
      retries: 18
      delay: 10
      until: secure_channel_check.stdout_lines | last == "ready"
      when: domain_join.changed

    - name: Wait until snowcmdb can be resolved from the domain
      ansible.windows.win_shell: |
        try {
          $acct = New-Object System.Security.Principal.NTAccount("{{ snowcmdb_user }}")
          $null = $acct.Translate([System.Security.Principal.SecurityIdentifier])
          Write-Output "ready"
        } catch {
          Write-Output "not_ready"
        }
      register: snowcmdb_lookup
      changed_when: false
      retries: 18
      delay: 10
      until: snowcmdb_lookup.stdout_lines | last == "ready"

    - name: Ensure snowcmdb is in local Administrators
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ snowcmdb_user }}"
        state: present

    - name: Ensure Ansible service account is in local Administrators
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ windows_automation_user }}"
        state: present

    # Keep disabled until the bootstrap/rotation flow is finalized.
    # - name: Update hetwinadmin password
    #   ansible.windows.win_user:
    #     name: hetwinadmin
    #     password: "{{ hetwinadmin_password }}"
    #     update_password: always
    #   no_log: true